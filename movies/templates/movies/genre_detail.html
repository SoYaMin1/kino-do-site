{% extends 'base.html' %}
{% block title %}{{ genre.name }}{% endblock %}

{% block content %}
<h1 class="mb-4">Жанр: {{ genre.name }}</h1>
<div class="row g-4">
    {% for movie in page_obj %}
    <div class="col-6 col-md-4 col-lg-3">
        <div class="card h-100">
            <a href="{{ movie.get_absolute_url }}">
                <img src="{{ movie.poster.url }}" class="card-img-top" style="height: 380px; object-fit: cover;" alt="{{ movie.title }}">
            </a>
            <div class="card-body">
                <h6>{{ movie.title }}</h6>
                <p class="text-muted small">{{ movie.year }} • ★ {{ movie.rating }}</p>
            </div>
        </div>
    </div>
    {% empty %}
        <p>Нет фильмов в этом жанре</p>
    {% endfor %}
</div>
{% endblock %}
