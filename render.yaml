databases:
  - name: kino-do-db
    plan: free
    databaseName: kinodo
    user: kinodo_user

services:
  - type: web
    name: kino-do
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn movie_site.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kino-do-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.13.3